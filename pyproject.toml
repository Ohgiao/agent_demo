[project]
name = "agent-demo"
version = "0.1.0"
description = "企业知识库骨架：FastAPI + LangChain + pgvector + Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-postgres>=0.0.19,<0.1",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pdfreader>=0.1.15",
    "chardet>=7.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
